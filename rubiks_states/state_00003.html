<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's 2x2 - State 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #ffffff;
            --yellow: #ffff00;
            --red: #ff0000;
            --orange: #ff9900;
            --blue: #0066ff;
            --green: #00aa00;
            --dark-bg: #0a0e27;
            --accent: #00d9ff;
            --text: #f0f0f0;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a3e 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1400px;
            padding: 2rem;
        }

        h1 {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
            letter-spacing: 3px;
            color: var(--accent);
        }

        .cube-container {
            perspective: 1200px;
            width: 350px;
            height: 350px;
            position: relative;
            margin-top: 4rem;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateStart 4s infinite linear;
        }

        @keyframes rotateStart {
            from {
                transform: rotateX(20deg) rotateY(30deg);
            }
            to {
                transform: rotateX(20deg) rotateY(390deg);
            }
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .sticker {
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.5);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3),
                        0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .face.top { transform: rotateX(90deg) translateZ(175px); }
        .face.bottom { transform: rotateX(-90deg) translateZ(175px); }
        .face.front { transform: translateZ(175px); }
        .face.back { transform: rotateY(180deg) translateZ(175px); }
        .face.right { transform: rotateY(90deg) translateZ(175px); }
        .face.left { transform: rotateY(-90deg) translateZ(175px); }

        .controls {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }

        .controls h2 {
            font-size: 1.4em;
            margin-bottom: 1.5rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .state-info {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .state-counter {
            font-size: 2em;
            color: var(--accent);
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            margin-bottom: 0.5rem;
        }

        .move-sequence {
            font-size: 0.9em;
            color: #aaa;
            word-break: break-word;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .move-btn {
            padding: 0.9rem;
            font-size: 0.95em;
            font-weight: bold;
            border: 2px solid var(--accent);
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent);
            border-radius: 6px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: block;
            text-align: center;
            cursor: pointer;
        }

        .move-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }

        .right { border-color: var(--blue); color: var(--blue); }
        .right:hover { background: rgba(0, 100, 255, 0.2); }

        .left { border-color: var(--green); color: var(--green); }
        .left:hover { background: rgba(0, 170, 0, 0.2); }

        .top { border-color: var(--white); color: var(--white); }
        .top:hover { background: rgba(255, 255, 255, 0.1); }

        .bottom { border-color: var(--yellow); color: var(--yellow); }
        .bottom:hover { background: rgba(255, 255, 0, 0.15); }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .nav-btn {
            padding: 0.8rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .reset-btn {
            grid-column: 1 / -1;
            background: rgba(255, 100, 100, 0.1);
            border-color: #ff6464;
            color: #ff6464;
        }

        .reset-btn:hover {
            background: rgba(255, 100, 100, 0.2);
        }

        @media (max-width: 1024px) {
            .cube-container { width: 300px; height: 300px; }
            .controls { max-width: 100%; width: 100%; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .container { flex-direction: column; align-items: center; }
            .cube-container { width: 250px; height: 250px; }
        }
    </style>
</head>
<body>
    <h1>3D RUBIK'S 2x2</h1>

    <div class="container">
        <div class="cube-container">
            <div class="cube">
                <div class="face top"><div class="sticker" style="background: linear-gradient(135deg, #ff9900 0%, #e68000 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ff9900 0%, #e68000 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);"></div></div><div class="face bottom"><div class="sticker" style="background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ffff00 0%, #e6e600 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ffff00 0%, #e6e600 100%);"></div></div><div class="face front"><div class="sticker" style="background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);"></div></div><div class="face back"><div class="sticker" style="background: linear-gradient(135deg, #ff9900 0%, #e68000 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ffff00 0%, #e6e600 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ff9900 0%, #e68000 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #ffff00 0%, #e6e600 100%);"></div></div><div class="face right"><div class="sticker" style="background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);"></div></div><div class="face left"><div class="sticker" style="background: linear-gradient(135deg, #00aa00 0%, #008800 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #00aa00 0%, #008800 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #00aa00 0%, #008800 100%);"></div><div class="sticker" style="background: linear-gradient(135deg, #00aa00 0%, #008800 100%);"></div></div>
            </div>
        </div>

        <div class="controls">
            <h2>Controls</h2>

            <div class="state-info">
                <div class="state-counter">State 3 / 100</div>
            </div>

            <div class="move-sequence">
                L
            </div>

            <div class="button-grid">
                <a href="state_00016.html" class="move-btn right">R</a>
                <a href="state_00010.html" class="move-btn right">R'</a>
                <a href="state_00000.html" class="move-btn left">L</a>
                <a href="state_00022.html" class="move-btn left">L'</a>
                <a href="state_00023.html" class="move-btn top">U</a>
                <a href="state_00024.html" class="move-btn top">U'</a>
                <a href="state_00025.html" class="move-btn bottom">D</a>
                <a href="state_00026.html" class="move-btn bottom">D'</a>
            </div>

            <div class="nav-buttons">
                <a href="state_00000.html" class="nav-btn reset-btn">Reset</a>
                <a href="index.html" class="nav-btn">Home</a>
            </div>
        </div>
    </div>
</body>
</html>
