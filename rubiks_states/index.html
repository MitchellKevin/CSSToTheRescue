<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's 2x2 Cube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --dark-bg: #0a0e27;
            --accent: #00d9ff;
            --text: #f0f0f0;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a3e 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
        }
        
        h1 {
            font-size: 3em;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 2rem;
            color: #aaa;
        }
        
        .start-btn {
            padding: 1rem 2rem;
            font-size: 1.1em;
            border: 2px solid var(--accent);
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent);
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            display: inline-block;
        }
        
        .start-btn:hover {
            background: rgba(0, 217, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 217, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>3D RUBIK'S 2x2</h1>
        <p>Interactive 3D cube with 2000 different states</p>
        <a href="state_00000.html" class="start-btn">START</a>
    </div>
</body>
</html>
