<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rubik Cube Font Animation - 3D</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    perspective: 800px;
    font-family: Arial, sans-serif;
  }

  .text {
    display: flex;
    gap: 30px;
  }

  .cube {
    position: relative;
    width: 70px;
    height: 70px;
    transform-style: preserve-3d;
    animation: spin 1s infinite linear;
  }

  .face {
    position: absolute;
    width: 70px;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 26px;
    font-weight: bold;
    color: white;
    border: 2px solid black;
  }

  /* Grey cube theme */
  .front  { background: #e5e5e5; color: #111; transform: translateZ(35px); }
  .back   { background: #cfcfcf; color: #111; transform: rotateY(180deg) translateZ(35px); }
  .right  { background: #b5b5b5; color: #111; transform: rotateY(90deg) translateZ(35px); }
  .left   { background: #9e9e9e; color: #111; transform: rotateY(-90deg) translateZ(35px); }
  .top    { background: #f5f5f5; color: #111; transform: rotateX(90deg) translateZ(35px); }
  .bottom { background: #7d7d7d; color: #fff; transform: rotateX(-90deg) translateZ(35px); }

  @keyframes spin {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    50%  { transform: rotateX(180deg) rotateY(180deg); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }
</style>
</head>
<body>

<div class="text">
  <!-- M -->
  <div class="cube">
    <div class="face front">M</div>
    <div class="face back">M</div>
    <div class="face right">M</div>
    <div class="face left">M</div>
    <div class="face top">M</div>
    <div class="face bottom">M</div>
  </div>

  <!-- I -->
  <div class="cube" style="animation-delay: 0.5s;">
    <div class="face front">I</div>
    <div class="face back">I</div>
    <div class="face right">I</div>
    <div class="face left">I</div>
    <div class="face top">I</div>
    <div class="face bottom">I</div>
  </div>

  <!-- C -->
  <div class="cube" style="animation-delay: 1s;">
    <div class="face front">C</div>
    <div class="face back">C</div>
    <div class="face right">C</div>
    <div class="face left">C</div>
    <div class="face top">C</div>
    <div class="face bottom">C</div>
  </div>

  <!-- U -->
  <div class="cube" style="animation-delay: 1.5s;">
    <div class="face front">U</div>
    <div class="face back">U</div>
    <div class="face right">U</div>
    <div class="face left">U</div>
    <div class="face top">U</div>
    <div class="face bottom">U</div>
  </div>

  <!-- B -->
  <div class="cube" style="animation-delay: 2s;">
    <div class="face front">B</div>
    <div class="face back">B</div>
    <div class="face right">B</div>
    <div class="face left">B</div>
    <div class="face top">B</div>
    <div class="face bottom">B</div>
  </div>

  <!-- E -->
  <div class="cube" style="animation-delay: 2.5s;">
    <div class="face front">E</div>
    <div class="face back">E</div>
    <div class="face right">E</div>
    <div class="face left">E</div>
    <div class="face top">E</div>
    <div class="face bottom">E</div>
  </div>
</div>

</div>

</body>
</html>
